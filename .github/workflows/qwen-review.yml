# Qwen code review. STUB — runs only on manual dispatch for now.
# To gate PRs later: uncomment the `pull_request` trigger and add QWEN_API_KEY to
# the repository Secrets. `--ci` makes the job fail when findings reach review.config.json `failOn`.
name: qwen-review

on:
  workflow_dispatch:
  # pull_request:

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the base branch is available for the diff
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run Qwen review
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
        run: node scripts/review.mjs --ci --base origin/${{ github.base_ref || 'main' }}
      # Future: post reviews/*.md as an inline PR comment via `gh pr comment`.

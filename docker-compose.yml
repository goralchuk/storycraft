services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: storycraft
      POSTGRES_PASSWORD: storycraft
      POSTGRES_DB: storycraft
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: storycraft
      MINIO_ROOT_PASSWORD: storycraft
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
